[project]
name = "so101-core"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=1.33.0",
    "lerobot[feetech,hardware]>=0.6.1",
    "numpy>=2.2.6",
    "rerun-sdk>=0.40.0",
    "yourdfpy>=0.0.60",
]

[project.scripts]
so101-setup = "so101.cli.setup:run"
so101-teleop = "so101.cli.teleop:main"
so101-view-urdf = "so101.cli.view_urdf:main"
so101-fetch-urdfs = "so101.cli.fetch_urdfs:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/so101"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
